<div class="page">
  @if (wakeUpService.serverIsWakingUp()) {
    <dialog #dialog class="dialog-class waking">
      <span class="waking-line"
        ><app-icon name="bolt" [size]="18" /> Server is waking up, this may take up to a minute.</span
      >
      <span class="waking-line">
        Thank you for your patience!
        <mat-spinner diameter="19"></mat-spinner>
      </span>
    </dialog>
  }

  <div class="headers">
    <app-header-logged-in></app-header-logged-in>
    <app-city-header></app-city-header>
  </div>
  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>

<!-- Sélecteur temporaire pour comparer les thèmes -->
<select class="theme-picker" (change)="theme.set($any($event.target).value)">
  @for (t of themes; track t.id) {
    <option [value]="t.id" [selected]="t.id === theme()">{{ t.label }}</option>
  }
</select>
