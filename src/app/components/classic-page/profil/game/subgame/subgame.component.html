<div class="subgame">
  <div class="player">
    @if (otherPlayer) {
      @if (modifiedGameHistoryPlayer.id !== '--') {
        <button type="button" class="link" (click)="goToProfil(modifiedGameHistoryPlayer.id)">
          {{ modifiedGameHistoryPlayer.username }}
          <app-icon name="search" [size]="14" />
        </button>
      } @else {
        <span>{{ modifiedGameHistoryPlayer.username }}</span>
      }
    } @else {
      <span>{{ modifiedGameHistoryPlayer.username }}</span>
    }
  </div>
  <div class="stats">
    <span class="stat" title="Days survived"
      ><app-icon name="calendar" [size]="14" />{{ modifiedGameHistoryPlayer.day }}</span
    >
    <span class="stat def" title="Defense"
      ><app-icon name="shield" [size]="14" />{{ modifiedGameHistoryPlayer.defense }}</span
    >
    <span class="stat pts" title="Ranked points"
      ><app-icon name="ranked" [size]="14" />{{ modifiedGameHistoryPlayer.ranked_points }}</span
    >
  </div>
</div>
