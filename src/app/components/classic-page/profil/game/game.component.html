<div
  class="game"
  [class.win]="game.outcome === 'win'"
  [class.loss]="game.outcome === 'loss'"
  [class.draw]="game.outcome === 'draw'"
>
  <div class="game-head">
    <span class="neon-chip" [style.--c]="game.ranked ? 'var(--yellow)' : 'var(--cyan)'">
      {{ game.ranked ? 'Ranked' : 'Normal' }}
    </span>
    @if (game.outcome !== null) {
      <span class="result">{{ outcomeLabels[game.outcome] }}{{ game.forfeit ? ' (forfeit)' : '' }}</span>
    }
  </div>
  <app-subgame
    [gameHistoryPlayer]="game.player1"
    [outcome]="game.outcome"
    [ranked_points]="game.ranked_points"
    [otherPlayer]="false"
  >
  </app-subgame>
  @if (game.ranked) {
    <app-subgame
      [gameHistoryPlayer]="game.player2"
      [outcome]="opponentOutcome()"
      [ranked_points]="game.ranked_points"
      [otherPlayer]="true"
    >
    </app-subgame>
  }
</div>
