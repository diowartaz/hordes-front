<div class="container" [style.border-color]="color[win]">
  <app-subgame
    [gameHistoryPlayer]="game.player1"
    [win]="game.win"
    [ranked_points]="game.ranked_points"
    [otherPlayer]="false"
  >
  </app-subgame>
  @if (game.ranked) {
    <app-subgame
      [gameHistoryPlayer]="game.player2"
      [win]="!game.win"
      [ranked_points]="game.ranked_points"
      [otherPlayer]="true"
    >
    </app-subgame>
  }
</div>
