<app-classic-page [title]="'Bonus Shop'">
  <ng-container icon> 💰 </ng-container>
  <ng-container content>
    <div class="shop-container">
      <div class="shop-card container" *ngFor="let item of cityService.bonuses$ | async | keyvalue">
        <div class="shop-card-header">
          <span class="material-symbols-outlined icon">{{ item.value.icon }}</span>
          <div>
            <h3>{{ item.value.name }}</h3>
            <p class="shop-description">{{ item.value.description }}</p>
          </div>
        </div>

        <div class="shop-levels">
          <span
            >Level : <strong>{{ item.value.lvl }}</strong> / {{ item.value.lvl_max }}</span
          >
          <div class="progress-bar">
            <div class="progress" [style.width.%]="(item.value.lvl / item.value.lvl_max) * 100"></div>
          </div>
        </div>

        <div *ngIf="item.value.lvl < item.value.lvl_max" class="shop-footer">
          <span class="shop-price">{{ item.value.price * Math.pow(2, item.value.lvl) }} 💰</span>
          <button
            *ngIf="item.value.lvl < item.value.lvl_max && money >= item.value.price * Math.pow(2, item.value.lvl)"
            class="buy-button"
            (click)="buyItem(item.value.id)"
            [disabled]="item.value.lvl >= item.value.lvl_max || money < item.value.price * Math.pow(2, item.value.lvl)"
          >
            Buy
          </button>
        </div>
      </div>
    </div>
  </ng-container>
</app-classic-page>
