<app-classic-page [title]="'Settings'" [glow]="'var(--cyan)'">
  <ng-container icon><app-icon name="settings" [size]="28" /></ng-container>
  <ng-container content>
    <div class="settings">
      <button type="button" class="ghost-btn" (click)="authService.logOut()">
        <app-icon name="logout" [size]="18" />Log out
      </button>
      <button type="button" class="ghost-btn" style="--c: var(--danger)" (click)="deleteAccount()">
        <app-icon name="trash" [size]="18" />Delete my account
      </button>
    </div>
  </ng-container>
</app-classic-page>
