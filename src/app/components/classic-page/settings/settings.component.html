<app-classic-page [title]="'Settings'">
  <ng-container icon> ⚙️ </ng-container>
  <ng-container content>
    <button class="yellow-button" (click)="logOut()">
      <span class="material-icons icon-header">logout</span><span>Log Out</span>
    </button>
    <button class="yellow-button" (click)="deleteAccount()">
      <span class="material-icons icon-header">delete</span><span>Delete my account</span>
    </button>
  </ng-container>
</app-classic-page>
