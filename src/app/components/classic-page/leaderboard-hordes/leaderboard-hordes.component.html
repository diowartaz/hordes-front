<app-classic-page
  [title]="'Leaderboard'"
  [subtitle]="ranked() ? 'Top players · Ranked points' : 'Top players · Days survived'"
>
  <ng-container icon><app-icon name="trophy" [size]="28" /></ng-container>
  <ng-container content>
    <div class="tabs" role="tablist">
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="ranked()"
        [class.active]="ranked()"
        (click)="changeRanked(true)"
      >
        Ranked
      </button>
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="!ranked()"
        [class.active]="!ranked()"
        (click)="changeRanked(false)"
      >
        Normal
      </button>
    </div>

    @if (podium().length > 0) {
      <div class="podium">
        @for (user of podium(); track user.user_id) {
          <button
            type="button"
            class="step"
            [class]="'step place-' + user.rank"
            [attr.aria-label]="'See the profile of ' + user.username"
            (click)="goToProfil(user.user_id)"
          >
            @if (user.rank === 1) {
              <app-icon class="crown" name="crown" [size]="26" />
            }
            <span class="avatar">{{ user.username.charAt(0).toUpperCase() }}</span>
            <span class="who">{{ user.username_truncated }}</span>
            <span class="block">
              <span class="place">{{ user.rank }}</span>
              <span class="score">{{ scoreOf(user) }}</span>
            </span>
          </button>
        }
      </div>
    }

    <div class="list">
      @for (user of others(); track user.user_id) {
        <button
          type="button"
          class="row"
          [class.me]="user.user_id === authService.userId()"
          (click)="goToProfil(user.user_id)"
        >
          <span class="rank">{{ user.rank }}</span>
          <span class="name">{{ user.username_truncated }}</span>
          @if (ranked()) {
            <span class="value"><app-icon name="ranked" [size]="14" />{{ user.ranked_points }}</span>
          } @else {
            <span class="value"><app-icon name="calendar" [size]="14" />{{ user.personal_best_day }}</span>
            <span class="value zb"><app-icon name="zombie" [size]="14" />{{ user.personal_best_zb }}</span>
          }
          <span class="meter"><span [style.width.%]="ratioOf(user)"></span></span>
        </button>
      }
    </div>
  </ng-container>

  @if (authService.isConnected()) {
    <div footer class="my-rank">
      @if (me(); as me) {
        <span class="rank">#{{ me.rank }}</span>
        <span class="name">You</span>
        <span class="score">{{ scoreOf(me) }}</span>
      } @else {
        <span class="rank">#—</span>
        <span class="name">You</span>
        <span class="hint">Not in the top yet</span>
      }
    </div>
  }
</app-classic-page>
