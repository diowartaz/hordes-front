<div class="classic-page">
  <header class="page-header">
    <button type="button" class="icon-btn" aria-label="Back" (click)="goBack()">
      <app-icon name="back" />
    </button>
    <div class="titles">
      <h1 class="neon-title" [style.--glow]="glow">{{ title }}</h1>
      @if (subtitle) {
        <span class="label">{{ subtitle }}</span>
      }
    </div>
    <span class="deco" [style.color]="glow"><ng-content select="[icon]"></ng-content></span>
  </header>

  <div class="content"><ng-content select="[content]"></ng-content></div>
  <ng-content select="[footer]"></ng-content>
</div>
