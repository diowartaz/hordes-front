<div class="building" [style.--c]="building.rarity | rarityToColor">
  <span class="tier" [title]="building.rarity"></span>
  <div class="body">
    <div class="row">
      <span class="name">{{ building.name }}</span>
      <span class="def"><app-icon name="shield" [size]="13" />{{ building.defense }}</span>
      <span
        class="percentdef"
        [class.percentdef-green]="building.defense_ratio_percentage >= 0"
        [class.percentdef-red]="building.defense_ratio_percentage < 0"
        >{{ building.defense_ratio_percentage >= 0 ? '+' : '' }}{{ building.defense_ratio_percentage }}%</span
      >
    </div>
    <app-building-recap-inventory-inventory [building]="building"></app-building-recap-inventory-inventory>
    <div class="row meta">
      <span><app-icon name="clock" [size]="13" />{{ getTimeBuildingString() }}</span>
      <span><app-icon name="trend" [size]="13" />{{ building.lvl }}/{{ building.lvl_max }}</span>
    </div>
  </div>
</div>
