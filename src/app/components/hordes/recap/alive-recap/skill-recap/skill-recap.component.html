<div class="skill">
  <div class="icon-tile"><app-icon name="book" [size]="22" /></div>
  <span class="name">{{ skill.name }}</span>
  <span class="lvl">LV {{ skill.lvl }}/{{ skill.old_lvl_max }}</span>
  <app-icon name="arrow-right" [size]="14" class="up" />
  <span class="lvl after">{{ skill.lvl }}/{{ skill.lvl_max }}</span>
</div>
