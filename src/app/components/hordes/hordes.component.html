<div class="content-wrapper">
  @if (generalSpeedVariation() !== 0) {
    <div
      class="icon-btn aaaa"
      [class.green-icon]="generalSpeedVariation() > 0"
      [class.red-icon]="generalSpeedVariation() < 0"
    >
      {{ generalSpeedVariationString() }} 🚀
    </div>
  }
  <router-outlet></router-outlet>
</div>
<app-city-footer></app-city-footer>
