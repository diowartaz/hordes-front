<div class="boundary">
  <button *ngIf="!goBackButton" class="back-btn icon-btn" (click)="goBackCityView()">
    <span class="material-symbols-outlined icon"> keyboard_return </span>
  </button>
  <div class="header container">Settings</div>
  <div class="content">
    <button (click)="logOut()">
      <span class="material-icons icon-header">logout</span><span>Log Out</span>
    </button>
    <button (click)="deleteAccount()">
      <span class="material-icons icon-header">delete</span><span>Delete my account</span>
    </button>
  </div>
</div>
