<app-feature-list></app-feature-list>

<div class="actions">
  <button type="button" class="ghost-btn wiki-btn" (click)="router.navigate([RoutesEnum.WIKI])">
    <app-icon name="bookmark" [size]="18" />Discover the guide
  </button>
  <button type="button" class="cta cta-pink" (click)="authService.signInTemp()">
    @if (authService.signInTempLoading()) {
      <mat-spinner diameter="22"></mat-spinner>
    } @else {
      <app-icon name="gamepad" [size]="22" />
    }
    Play as guest
  </button>
  <button type="button" class="ghost-btn" (click)="useYourAccount()">
    <app-icon name="key" [size]="18" />Use my own account
  </button>
</div>
