<app-feature-list></app-feature-list>

<section class="neon-card deck-summary">
  <div class="deck-head">
    <app-icon name="cards" [size]="20" />
    <h2>Deck · {{ deckBuildings().length }} plans</h2>
    @for (entry of deckRarities(); track entry.rarity) {
      <span class="neon-chip" [style.--c]="entry.rarity | rarityToColor">{{ entry.rarity }} {{ entry.count }}</span>
    }
  </div>
  <app-resource-shares [buildings]="deckBuildings()" />
  <button type="button" class="ghost-btn" style="--c: var(--cyan)" (click)="router.navigate([RoutesEnum.DECK])">
    <app-icon name="cards" [size]="18" />Edit deck
  </button>
</section>

<div class="go-to-wiki">
  <span>First time here?</span>
  <button type="button" class="ghost-btn" style="--c: var(--violet-light)" (click)="router.navigate([RoutesEnum.WIKI])">
    <app-icon name="bookmark" [size]="18" />Read the guide
  </button>
</div>
<div class="modes">
  <button type="button" class="ghost-btn" (click)="createCity(false)">
    <app-icon name="play" [size]="18" />Play normal
  </button>
  <button type="button" class="cta cta-gold ranked" (click)="createCity(true)">
    <app-icon name="ranked" [size]="20" />
    <span class="ranked-text">Play ranked<small>+50% coins</small></span>
  </button>
</div>
