<div class="top-bar">
  @if (authService.isConnected()) {
    <button type="button" class="coins" aria-label="Open the shop" (click)="router.navigate([RoutesEnum.SHOP])">
      <span class="coins-plus"><app-icon name="plus" [size]="18" /></span>
      <span class="coins-amount">{{ data().money }}</span>
      <app-icon class="coins-icon" name="money" [size]="18" />
      @if (cityService.nbBuyableBonuses() > 0) {
        <span class="coins-badge">{{
          cityService.nbBuyableBonuses() > 9 ? '9+' : cityService.nbBuyableBonuses()
        }}</span>
      }
    </button>
    @if (authService.tempAccount()) {
      <span class="no-cloud-save">no cloud<br />save</span>
    }
  }
  <div class="spacer"></div>
  @if (authService.isConnected()) {
    <a class="icon-btn" aria-label="Deck" [routerLink]="['/', RoutesEnum.DECK]" routerLinkActive="active">
      <app-icon name="cards" />
    </a>
    <a class="icon-btn" aria-label="Invite friends" [routerLink]="['/', RoutesEnum.REFERRAL]" routerLinkActive="active">
      <app-icon name="user-plus" />
    </a>
    <a
      class="icon-btn"
      aria-label="Profile"
      [routerLink]="['/', RoutesEnum.PROFIL]"
      [queryParams]="{ user_id: authService.userId() }"
      routerLinkActive="active"
    >
      <app-icon name="friends" />
    </a>
  }
  <a class="icon-btn" aria-label="Leaderboard" [routerLink]="['/', RoutesEnum.LEADERBOARD]" routerLinkActive="active">
    <app-icon name="trophy" />
  </a>
  <a class="icon-btn" aria-label="Guide" [routerLink]="['/', RoutesEnum.WIKI]" routerLinkActive="active">
    <app-icon name="bookmark" />
  </a>
  @if (authService.isConnected()) {
    <a class="icon-btn" aria-label="Settings" [routerLink]="['/', RoutesEnum.SETTINGS]" routerLinkActive="active">
      <app-icon name="settings" />
    </a>
  }
</div>
