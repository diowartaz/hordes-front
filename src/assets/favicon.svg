<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Version simplifiée du logo (tête + anneau) pour la favicon -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8f52"/>
      <stop offset="1" stop-color="#2f4a2c"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="118" fill="#0c0614" stroke="#7a0f2e" stroke-width="16"/>

  <!-- Tête de zombie -->
