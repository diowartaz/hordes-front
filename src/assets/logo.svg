<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#170a24"/>
      <stop offset="1" stop-color="#050309"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8f52"/>
      <stop offset="1" stop-color="#2f4a2c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Disque de fond -->
  <circle cx="256" cy="200" r="150" fill="#0c0614"/>

  <!-- Tête de zombie -->
  <g transform="translate(256 210)">
    <path d="M-78 -10 C-82 -80 -40 -112 0 -112 C44 -112 84 -82 78 -14 C76 18 66 34 56 46 L52 82 C30 96 -30 96 -52 82 L-56 46 C-68 32 -78 16 -78 -10 Z"
          fill="url(#skin)" stroke="#05030a" stroke-width="6"/>
    <!-- Cicatrice cousue -->
    <path d="M-46 -84 L-14 -54" stroke="#05030a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M-42 -64 L-30 -76 M-30 -54 L-20 -66" stroke="#05030a" stroke-width="4" stroke-linecap="round"/>
    <!-- Yeux -->
    <ellipse cx="-32" cy="-4" rx="22" ry="20" fill="#05030a"/>
    <ellipse cx="32" cy="-2" rx="18" ry="22" fill="#05030a"/>
    <g filter="url(#glow)">
      <circle cx="-30" cy="-2" r="7" fill="#a8102e"/>
      <circle cx="34" cy="0" r="6" fill="#a8102e"/>
    </g>
    <!-- Nez -->
    <path d="M-6 26 L0 14 L6 26 Z" fill="#05030a"/>
    <!-- Bouche cousue -->
    <path d="M-36 50 Q0 62 36 50" stroke="#05030a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-24 44 L-22 62 M-8 47 L-7 65 M8 47 L8 65 M24 44 L22 62" stroke="#05030a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <circle cx="256" cy="200" r="150" fill="none" stroke="#7a0f2e" stroke-width="8" filter="url(#glow)"/>

  <!-- Titre -->
  <g font-family="Impact, 'Arial Black', sans-serif" text-anchor="middle">
    <text x="256" y="420" font-size="68" letter-spacing="4" fill="#6f8f52" stroke="#05030a" stroke-width="3" paint-order="stroke">ZOMBIE</text>
    <text x="256" y="476" font-size="48" letter-spacing="14" fill="#8a1a3a" stroke="#05030a" stroke-width="3" paint-order="stroke">WAVES</text>
  </g>
</svg>
